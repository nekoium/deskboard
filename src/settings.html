<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings - Deskboard</title>
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <div class="container">
    <h1>Settings</h1>
    
    <div class="section">
      <h2>Keyboard Shortcut</h2>
      <p class="description">Press keys to set the edit mode shortcut</p>
      <input type="text" id="shortcut-input" readonly placeholder="Press keys...">
      <p class="hint">Current: <span id="current-shortcut"></span></p>
    </div>

    <div class="section">
      <h2>Startup</h2>
      <label class="checkbox-label">
        <input type="checkbox" id="launch-at-login">
        <span>Launch Deskboard at login</span>
      </label>
    </div>

    <div class="section">
      <h2>Data</h2>
      <button id="open-data-folder" class="button secondary">Open Data Folder</button>
    </div>

    <div class="section">
      <h2>About</h2>
      <p>Version: <span id="version"></span></p>
    </div>

    <div class="actions">
      <button id="save-button" class="button primary">Save</button>
      <button id="cancel-button" class="button">Cancel</button>
    </div>
  </div>

  <script src="settings.js"></script>
</body>
</html>
